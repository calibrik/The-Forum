name: Run Tests and Deploy

on:
    push:
        branches: [production]
    pull_request:
        branches: [production]
    workflow_dispatch:

jobs:
    test-suite:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: "npm"

            - name: Install Dependencies
              run: npm ci

            - name: Execute Tests
              run: npm run test:ci

            - name: Compile App
              run: npm run build

    deployment:
        runs-on: ubuntu-latest
        needs: test-suite
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24

            - name: Install Dependencies
              run: npm ci

            - name: Build React App
              run: npm run build

            - name: Deploy to Netlify
              run: npx netlify-cli deploy --prod --dir=./dist
              env:
                  NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
                  NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
