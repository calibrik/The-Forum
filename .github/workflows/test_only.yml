name: Run Tests

on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]
    workflow_dispatch:

jobs:
    test-suite:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: "npm"

            - name: Install Dependencies
              run: npm ci

            - name: Execute Tests
              run: npm run test:ci

            - name: Compile App
              run: npm run build
